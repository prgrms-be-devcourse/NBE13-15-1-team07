spring:
  application:
    name: cafe
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/cafe?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:cafe}
    password: ${DB_PASSWORD:cafe1234}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  sql:
    init:
      mode: always
  jackson:
    time-zone: Asia/Seoul

server:
  port: 8080

# 프론트(web/) 개발 서버 주소. 명세 기준 http://127.0.0.1:8000
app:
  cors:
    allowed-origins: http://127.0.0.1:8000,http://localhost:8000
